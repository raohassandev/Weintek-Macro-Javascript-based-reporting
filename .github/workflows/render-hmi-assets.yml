name: Build UCS HMI PNG screen assets
on:
  push:
    branches: [main]
    paths:
      - 'designs/resource-manager/*.svg'
      - 'tools/render_hmi_assets.py'
      - '.github/workflows/render-hmi-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG conversion
        run: python -m pip install cairosvg
      - name: Render 1600x900 assets
        run: python tools/render_hmi_assets.py
      - name: Verify PNG format and nontrivial images
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("resource-manager-light.png", "resource-manager-background-only.png"):
              file = Path("designs/resource-manager") / name
              assert file.exists() and file.stat().st_size > 10000, name
              with file.open("rb") as source:
                  assert source.read(8) == b"\x89PNG\r\n\x1a\n", name
              print("Rendered asset:", file, file.stat().st_size, "bytes")
          PY
      - name: Commit generated binary PNGs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs/resource-manager/resource-manager-light.png designs/resource-manager/resource-manager-background-only.png
          if git diff --cached --quiet; then
            echo "PNG assets already current."
          else
            git commit -m "assets: render UCS executive EBPro backgrounds [skip ci]"
            git push origin HEAD:main
          fi
