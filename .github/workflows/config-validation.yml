name: Site profile validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check all site profile examples
        run: python scripts/validate_site_profiles.py
      - name: Negative and positive validation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
